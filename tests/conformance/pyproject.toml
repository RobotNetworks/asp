[project]
name = "asp-conformance"
version = "0.1.0"
description = "Conformance tests for ASP operators."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "websockets>=13.0",
    "jsonschema>=4.21",
    "referencing>=0.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
